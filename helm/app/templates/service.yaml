apiVersion: v1
kind: Service
metadata:
  name: {{ include "demo-app.fullname" . }}
  labels: { app.kubernetes.io/name: {{ include "demo-app.name" . }} }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: {{ include "demo-app.name" . }} }
  ports: [{ name: http, port: {{ .Values.service.port }}, targetPort: http }]
